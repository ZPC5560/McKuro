name: Sync release notes from CHANGELOG.md
description: >
  Creates the GitHub Release for the current tag with this version's section of
  CHANGELOG.md as the body — the repo changelog, the website changelog section
  and the Release notes stay one single source. Since v1.3.8.1 a section may carry
  an English body as well; when it does, the Release body ships both (Chinese
  first, then `## English` below a rule) so one Release serves both languages.
  Idempotent: the note body is compared first and skipped when already equal;
  a stale/mismatched release is deleted and recreated (the REST update API
  returns HTTP 422 when the release's tag binding no longer matches the tag).
  Callers should hold a shared concurrency group per tag so parallel publish
  jobs do not race on the delete/create (see build-and-test.yml).

runs:
  using: composite
  steps:
    - name: Extract section and push to Release
      shell: bash
      env:
        # action_bundler_token 与 github.token 为同一 JWT;用该别名以免凭据掩码规则误替换字面量
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        ver="${TAG#v}"
        notes="$(mktemp)"
        # 中英文各自先落到独立文件,再拼成最终正文:
        # 中文正文与旧版逐字节一致(extract 默认行为不变),英文只在存在时追加,
        # 因此「没有英文块的历史版本」产生的正文与改造前完全相同。
        zh="$(mktemp)"
        en="$(mktemp)"
        trap 'rm -f "$notes" "$zh" "$en"' EXIT
        if ! python3 tools/changelog.py extract "$ver" -o "$zh"; then
          echo "::error::CHANGELOG.md has no section for ${ver} — write the changelog entry before pushing the tag."
          exit 1
        fi
        cp "$zh" "$notes"
        # has-lang: 0=有英文正文, 1=没有(历史版本), 2=版本不存在(上面已挡住)
        if python3 tools/changelog.py has-lang "$ver" en; then
          python3 tools/changelog.py extract "$ver" --lang en -o "$en"
          # 分隔线 + `## English`:GitHub 会把 `---` 渲染成一条水平线,两种语言分得清
          {
            printf '\n---\n\n## English\n\n'
            cat "$en"
          } >> "$notes"
          echo "release body is bilingual (zh + en)"
        else
          echo "no English body for ${ver} — releasing Chinese only"
        fi
        # 幂等:先看 Release 是否已存在且正文一致,一致就跳过;否则确保它存在。
        #
        # 踩过的坑(2026-10-31 v1.3.7.5 实测,务必保留注释):
        # 1) `gh release create ... || gh release edit ...`:四个 publish job
        #    (win / osx-arm64 / osx-x64 / linux)会并发执行本 action,首个 job 建成后
        #    其余 create 报 "tag_name already exists" 而落到 edit。
        # 2) `gh release edit <tag>` 与 `gh api -X PATCH .../releases/<id>` **都会**
        #    返回 HTTP 422 "Release.tag_name already exists" —— 即便请求体里只发
        #    body、完全不提 tag_name。根因是 Release 记录的 tag 绑定与真实 tag 对象
        #    不一致(本次因强制把 tag 移到新提交而触发)。此状态下 REST 更新不可行。
        # 3) 因此:正文缺失/不一致时才重建 —— 先 `--cleanup-tag=false` 删掉旧记录
        #    再 create,可自愈 tag 移动造成的失配。并发下删除会互相踩,
        #    故删除+创建的窗口用"重试 create"兜住:谁先建成谁赢,失败方在下一轮
        #    读到一致正文即跳过。
        existing_body="$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)"
        if [ -n "$existing_body" ] && [ "$existing_body" = "$(cat "$notes")" ]; then
          echo "release notes for $TAG already up to date, skipping"
          exit 0
        fi

        if [ -n "$existing_body" ]; then
          # 正文过期或记录失配:删掉再建(保留 tag)
          gh release delete "$TAG" --yes --cleanup-tag=false || true
          echo "existing release $TAG deleted (stale tag binding or outdated notes), recreating"
        fi

        # create 失败不立即致命:可能是并发的另一个 job 刚建成。
        for attempt in 1 2 3 4 5; do
          if gh release create "$TAG" --title "McKuro $TAG" --notes-file "$notes" --verify-tag; then
            echo "release notes for $TAG created from CHANGELOG.md ($(wc -l < "$notes") lines)"
            exit 0
          fi
          echo "create attempt $attempt failed (likely concurrent create), re-checking…"
          sleep $((attempt * 3))
          cur="$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)"
          if [ -n "$cur" ] && [ "$cur" = "$(cat "$notes")" ]; then
            echo "release notes for $TAG already created by a concurrent job with identical notes"
            exit 0
          fi
        done
        echo "::error::failed to create or verify release $TAG after retries"
        exit 1
