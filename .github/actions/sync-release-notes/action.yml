name: Sync release notes from CHANGELOG.md
description: >
  Creates (or edits) the GitHub Release for the current tag with this version's
  section of CHANGELOG.md as the body — the repo changelog, the website
  changelog section and the Release notes stay one single source.
  Safe to run from several parallel publish jobs: create is idempotent via
  `create || edit`, and every job writes the exact same notes.

runs:
  using: composite
  steps:
    - name: Extract section and push to Release
      shell: bash
      env:
        # action_bundler_token 与 github.token 为同一 JWT;用该别名以免凭据掩码规则误替换字面量
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        ver="${TAG#v}"
        notes="$(mktemp)"
        trap 'rm -f "$notes"' EXIT
        if ! python3 tools/changelog.py extract "$ver" -o "$notes"; then
          echo "::error::CHANGELOG.md has no section for ${ver} — write the changelog entry before pushing the tag."
          exit 1
        fi
        # 幂等:先显式判断 Release 是否存在,再决定 create / edit。
        #
        # 不要写成 `gh release create ... || gh release edit ...`:
        # 多个 publish job(win / macOS 两个矩阵 / linux)会并发执行本 action,
        # 首个 job 建成 Release 后,其余 job 的 create 会以 "Release.tag_name already
        # exists" 失败并落到 edit;而 `gh release edit <tag>` 会把 <tag> 当作 tag_name
        # 一并提交,在 tag 已存在时返回 HTTP 422(实测 v1.3.7.5 的 win/macOS 任务
        # 因此全部失败,只有抢在最前的 linux 成功)。
        # 这里改为先查询:已存在就只改正文与标题(--notes-file / --title 不触碰 tag)。
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release edit "$TAG" --title "McKuro $TAG" --notes-file "$notes"
          echo "release notes for $TAG updated (existing release) from CHANGELOG.md ($(wc -l < "$notes") lines)"
        else
          gh release create "$TAG" --title "McKuro $TAG" --notes-file "$notes" --verify-tag
          echo "release notes for $TAG created from CHANGELOG.md ($(wc -l < "$notes") lines)"
        fi
