name: build-and-test

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_win:
        description: "发布 Windows AOT 版本 (win-x64)"
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore McKuro.slnx

      - name: Build (Release)
        run: dotnet build McKuro.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/McKuro.Tests/McKuro.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  publish-win:
    name: Publish Windows AOT (win-x64)
    # 手动触发(勾选 publish_win)或 tag v* 发布时运行
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_win == true) || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write   # tag 发布时把 zip 绿色包附加到 GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # tag 发布第一步:Release 正文取自 CHANGELOG.md(与官网更新日志同源),
      # 后续各 job 的 gh release upload 因此必然有目标 Release
      - name: Sync release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/sync-release-notes

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-win-${{ hashFiles('**/*.csproj', '**/Directory.*') }}
          restore-keys: |
            nuget-win-

      - name: Publish (AOT, self-contained)
        run: dotnet publish src/McKuro/McKuro.csproj -c Release -r win-x64 --self-contained -p:PublishAot=true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: McKuro-win-x64
          path: src/McKuro/bin/Release/net10.0/win-x64/publish/

      # zip 绿色包附加到 Release(应用内自更新的"优先 zip"通道依赖此资产;版本号取 tag)
      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $zip = "McKuro-win-x64-$ver.zip"
          Compress-Archive -Path src/McKuro/bin/Release/net10.0/win-x64/publish/* -DestinationPath $zip
          # sha256 摘要资产:应用内自更新据此校验下载包(UpdateChecksum 解析 <资产名>.sha256)。
          # 必须写成 GitHub 自动摘要风格 "SHA256 (name) = <hex>",该格式已被解析器覆盖并有单测。
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "SHA256 ($zip) = $hash" | Out-File -Encoding ascii -NoNewline "$zip.sha256"
          gh release upload $env:GITHUB_REF_NAME $zip "$zip.sha256" --clobber

  publish-macos:
    name: Publish macOS AOT (${{ matrix.rid }})
    # 仅 tag 发布时运行;AOT 无法交叉编译,macOS 产物必须 macOS runner
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-osx-${{ matrix.rid }}-${{ hashFiles('**/*.csproj', '**/Directory.*') }}
          restore-keys: |
            nuget-osx-${{ matrix.rid }}-

      # 幂等保证 Release 存在且正文=CHANGELOG.md 小节(matrix 并发下 create||edit 结果一致)
      - name: Sync release notes from CHANGELOG.md
        uses: ./.github/actions/sync-release-notes

      - name: Publish (AOT, self-contained)
        run: dotnet publish src/McKuro/McKuro.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishAot=true

      # 把 libmpv 依赖树打包进 publish/libmpv(启动页视频开箱可用)。
      # 仅 arm64:runner 是 Apple Silicon,brew 只有 arm64 dylib,x64 包混入会加载失败(回退静态封面)。
      - name: Bundle libmpv into publish dir
        if: matrix.rid == 'osx-arm64'
        run: |
          brew install mpv
          bash src/McKuro/bundle-mpv-macos.sh "src/McKuro/bin/Release/net10.0/${{ matrix.rid }}/publish"

      - name: Zip & attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          zip="McKuro-${{ matrix.rid }}-$ver.zip"
          # 平铺打包(zip 根即程序目录,解压后 chmod +x 即可运行)
          (cd "src/McKuro/bin/Release/net10.0/${{ matrix.rid }}/publish" && zip -qr "$GITHUB_WORKSPACE/$zip" .)
          # sha256 摘要资产(macOS 自更新下载的就是这个平铺 zip)
          cd "$GITHUB_WORKSPACE"
          echo "SHA256 ($zip) = $(shasum -a 256 "$zip" | cut -d' ' -f1)" > "$zip.sha256"
          gh release upload "$GITHUB_REF_NAME" "$zip" "$zip.sha256" --clobber

      # .app 包:应用图标 + Info.plist + ad-hoc 签名(双击启动/Dock 图标正常)+ 拖拽安装 .dmg
      - name: Build .app bundle & attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          appzip="McKuro-${{ matrix.rid }}-$ver.app.zip"
          dmg="McKuro-${{ matrix.rid }}-$ver.dmg"
          bash packaging/make-mac-app.sh "src/McKuro/bin/Release/net10.0/${{ matrix.rid }}/publish" "$ver" "$GITHUB_WORKSPACE/$appzip"
          gh release upload "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE/$appzip" "$GITHUB_WORKSPACE/$dmg" --clobber

  publish-linux:
    name: Publish Linux AOT (linux-x64)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.csproj', '**/Directory.*') }}
          restore-keys: |
            nuget-linux-

      # 幂等保证 Release 存在且正文=CHANGELOG.md 小节
      - name: Sync release notes from CHANGELOG.md
        uses: ./.github/actions/sync-release-notes

      - name: Publish (AOT, self-contained)
        run: dotnet publish src/McKuro/McKuro.csproj -c Release -r linux-x64 --self-contained -p:PublishAot=true

      - name: Tar & attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          tar="McKuro-linux-x64-$ver.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/$tar" -C "src/McKuro/bin/Release/net10.0/linux-x64/publish" .
          # sha256 摘要资产(Linux 无自动更新资产,摘要供手动下载时自校验)
          cd "$GITHUB_WORKSPACE"
          echo "SHA256 ($tar) = $(shasum -a 256 "$tar" | cut -d' ' -f1)" > "$tar.sha256"
          gh release upload "$GITHUB_REF_NAME" "$tar" "$tar.sha256" --clobber

      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      # .deb(dpkg-deb)+ .rpm(rpmbuild 预置树直装):/opt/McKuro + 桌面项 + 图标
      - name: Build deb/rpm & attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          bash packaging/make-linux-packages.sh "src/McKuro/bin/Release/net10.0/linux-x64/publish" "$ver" dist
          gh release upload "$GITHUB_REF_NAME" "dist/mckuro_${ver}_amd64.deb" "dist/mckuro-$ver-1.x86_64.rpm" --clobber

  setup:
    name: Build installer (Inno Setup)
    needs: publish-win
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_win == true) || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write   # tag 发布时把安装包附加到 GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 幂等保证 Release 存在且正文=CHANGELOG.md 小节(installer attach 前)
      - name: Sync release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/sync-release-notes

      # 复用 publish-win 的 AOT 产物,不再重复 10 分钟链接构建;
      # 落到 setup.iss 的 MyAppPublishDir 默认路径
      - name: Download publish artifact
        uses: actions/download-artifact@v8
        with:
          name: McKuro-win-x64
          path: src/McKuro/bin/Release/net10.0/win-x64/publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress --params '"/LANG=ChineseSimplified"'
          # choco 静默安装可能不含可选语言组件,缺失时从 issrc 官方仓库补(与 6.7.x 编译器匹配)
          $isl = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          if (-not (Test-Path $isl)) {
            Write-Host "ChineseSimplified.isl missing, downloading from jrsoftware/issrc..."
            Invoke-WebRequest 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl' -OutFile $isl
          }

      - name: Compile installer
        shell: pwsh
        run: |
          # tag 触发取 tag 版本号;dispatch 从 csproj 读(避免硬编码回退到旧版本)
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = (Select-String -Path src/McKuro/McKuro.csproj -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          }
          Write-Host "installer version: $version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss /DMyAppVersion=$version

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: McKuro-setup
          path: artifacts/setup/*.exe

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # exe 是 Windows 上 zip 缺失时的回退更新资产,同样附 sha256 摘要
          Get-ChildItem artifacts/setup/*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "SHA256 ($($_.Name)) = $hash" | Out-File -Encoding ascii -NoNewline "$($_.FullName).sha256"
          }
          gh release upload "${{ github.ref_name }}" artifacts/setup/*.exe artifacts/setup/*.sha256 --clobber
